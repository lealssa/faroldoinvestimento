{% extends 'landing/base.html' %}

{% block title %}Contato - Farol do Investimento{% endblock %}

{% block content %}
<section class="section" style="padding-top: 6rem;">
    <div class="container">
        <div class="columns">
            <div class="column is-8 is-offset-2">
                <div class="card">
                    <div class="card-content">
                        <h1 class="title is-2 has-text-centered">Entre em Contato</h1>
                        <p class="subtitle has-text-centered">Vamos conversar sobre seus investimentos</p>
                        
                        <form method="post" x-data="{ interesse: 'consultoria' }">
                            {% csrf_token %}
                            <div class="field">
                                <label class="label">Nome Completo</label>
                                <div class="control">
                                    <input class="input" type="text" name="nome" required>
                                </div>
                            </div>
                            
                            <div class="columns">
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Email</label>
                                        <div class="control">
                                            <input class="input" type="email" name="email" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="column">
                                    <div class="field">
                                        <label class="label">WhatsApp</label>
                                        <div class="control">
                                            <input class="input" type="tel" name="telefone" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field">
                                <label class="label">Interesse</label>
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select name="interesse" x-model="interesse">
                                            <option value="consultoria">Consultoria</option>
                                            <option value="sistema">Sistema</option>
                                            <option value="ambos">Ambos</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field">
                                <label class="label">Mensagem (opcional)</label>
                                <div class="control">
                                    <textarea class="textarea" name="mensagem" rows="4"></textarea>
                                </div>
                            </div>
                            
                            <div class="field">
                                <div class="control">
                                    <button class="button is-warning is-fullwidth is-large" type="submit">
                                        <span class="icon"><i class="fab fa-whatsapp"></i></span>
                                        <span>Enviar e Falar no WhatsApp</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <hr>
                        
                        <div class="has-text-centered">
                            <h3 class="title is-4">Ou fale diretamente:</h3>
                            <a class="button is-success is-large" href="https://wa.me/5511999999999?text=Olá! Tenho interesse nos serviços do Farol do Investimento" target="_blank">
                                <span class="icon"><i class="fab fa-whatsapp"></i></span>
                                <span>WhatsApp Direto</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
