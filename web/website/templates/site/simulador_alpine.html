<!-- Calculadora de Renda Fixa com Alpine.js -->
<div class="block" x-data="simuladorRendaFixa()">
    <!-- Aviso mobile -->
    <article class="message is-info is-hidden-tablet">
        <div class="message-body has-text-centered">
            <span class="icon pr-3"><i class="fas fa-lightbulb"></i></span>
            <span>Use um PC para acessar o simulador completo</span>
        </div>
    </article>

    <!-- Simulador -->
    <div class="card">
        <div class="card-header has-background-white-ter">
            <p class="card-header-title has-text-grey-dark">Simulação #1</p>
        </div>

        <div class="card-content">
            <form action="#simuladorrendafixa" method="get" role="form" aria-label="Simulador de Investimentos em Renda Fixa" @submit.prevent>
            <fieldset>
                <div class="columns is-centered is-multiline is-variable">
                    <!-- Montante -->
                    <div class="column is-3">
                        <div class="field">
                            <label class="label has-text-weight-light">Montante</label>
                            <div class="control has-icons-left">
                                <span class="icon is-small is-left"><i class="fas fa-coins"></i></span>
                                <input class="input" type="text" name="montante" placeholder="R$ 0,00" value="R$ 0,00"
                                       x-model="montanteFormatado" @input="atualizarMontante($event.target.value)">
                            </div>
                        </div>
                    </div>

                    <!-- Prazo -->
                    <div class="column">
                        <div class="field">
                            <label class="label has-text-weight-light">Prazo a.m</label>
                            <div class="control has-icons-left">
                                <span class="icon is-small is-left"><i class="fas fa-calendar"></i></span>
                                <input class="input" type="number" name="prazo" placeholder="12" value="12"
                                       x-model="dadosEntrada.prazo" @input="calcular()">
                            </div>
                        </div>
                    </div>

                    <!-- Taxa -->
                    <div class="column">
                        <div class="field">
                            <label class="label has-text-weight-light" x-text="labelTaxa"></label>
                            <div class="control has-icons-right">
                                <input class="input" type="number" name="taxa" step="0.01" value="15"
                                       x-model="dadosEntrada.taxa" @input="calcular()">
                                <span class="icon is-small is-right"><i class="fas fa-percentage"></i></span>
                            </div>
                        </div>
                    </div>

                    <!-- Tipo -->
                    <div class="column is-2">
                        <div class="field">
                            <label class="label has-text-weight-light">Tipo</label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select name="tipo" x-model="dadosEntrada.tipoIndice" @change="alterarTipo()">
                                        <option value="pre" selected>Pré-fixado</option>
                                        <option value="pos">Pós-fixado</option>
                                        <option value="poupanca">Poupança</option>
                                        <option value="ipca">IPCA+</option>
                                        <option value="selic">SELIC+</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- IR -->
                    <div class="column">
                        <div class="field">
                            <label class="label has-text-weight-light">Isento IR</label>
                            <div class="control">
                                <label class="radio">
                                    <input type="radio" name="ir" 
                                           :checked="dadosEntrada.IR === false" 
                                           @click="dadosEntrada.IR = false; calcular()">
                                    Sim
                                </label>
                                <label class="radio">
                                    <input type="radio" name="ir" value="true" checked
                                           :checked="dadosEntrada.IR === true" 
                                           @click="dadosEntrada.IR = true; calcular()">
                                    Não
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Inflação -->
                    <div class="column">
                        <div class="field">
                            <label class="label has-text-weight-light">Inflação</label>
                            <div class="control">
                                <label class="radio">
                                    <input type="radio" name="inflacao" 
                                           :checked="dadosEntrada.calcularInflacao === true" 
                                           @click="dadosEntrada.calcularInflacao = true; calcular()">
                                    Sim
                                </label>
                                <label class="radio">
                                    <input type="radio" name="inflacao" value="false" checked
                                           :checked="dadosEntrada.calcularInflacao === false" 
                                           @click="dadosEntrada.calcularInflacao = false; calcular()">
                                    Não
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resultado -->
                <div class="columns is-vcentered has-text-centered">
                    <!-- valor vencimento -->
                    <div class="column">
                        <div class="box">
                            <p class="subtitle is-size-6">Valor no vencimento</p>
                            <p class="title is-size-5" x-text="formatarMoeda(resultado.valorNoVencimento)"></p>
                            <hr>
                            <p class="subtitle is-size-7">Inflação no período</p>
                            <p class="title is-size-6 has-text-danger mb-3" x-text="formatarMoeda(resultado.inflacaoPeriodo * -1)"></p>
                            <p class="is-size-7 has-text-danger" x-show="resultado.inflacaoPeriodo > 0" x-text="'(' + formatarPercentual(resultado.inflacaoPercentual) + ')'"></p>
                        </div>
                    </div>

                    <!-- rendimento bruto -->
                    <div class="column">
                        <div class="box">
                            <p class="subtitle is-size-6">Rendimento bruto</p>
                            <p class="title is-size-5" x-text="formatarMoeda(resultado.bruto)"></p>
                            <hr>
                            <p class="subtitle is-size-7">IR devido <span x-text="formatarPercentual(resultado.aliquotaIR * 100)"></span></p>
                            <p class="title is-size-6 has-text-danger" x-text="formatarMoeda(resultado.impostoDevido * -1)"></p>
                        </div>
                    </div>

                    <!-- rendimento líquido -->
                    <div class="column">
                        <div class="box">
                            <p class="subtitle is-size-6">Rendimento líquido</p>
                            <p class="title is-size-5" x-text="formatarMoeda(resultado.liquido)"></p>
                            <hr>
                            <p class="subtitle is-size-7">Dividido por <span x-text="dadosEntrada.prazo"></span> meses</p>
                            <p class="title is-size-6" x-text="formatarMoeda(resultado.divididoNoPrazo)"></p>
                        </div>
                    </div>
                </div>

                <button type="button" class="button is-rounded is-warning is-light is-outlined is-hidden-mobile"
                        @click="salvarSimulacao()">
                    <span class="icon"><i class="fas fa-plus"></i></span>
                    <span>Comparar</span>
                </button>
                
                <button type="button" class="button is-primary is-hidden" onclick="return false;">
                    <span class="icon"><i class="fas fa-calculator"></i></span>
                    <span>Calcular</span>
                </button>
            </fieldset>
            </form>
        </div>
    </div>

    <!-- Tabela Simulações -->
    <div class="block is-hidden-mobile has-background-white p-4 table-container" 
         x-show="simulacoes.length > 0" style="display: none;">
        <table class="table is-fullwidth is-hoverable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Valor aplicado</th>
                    <th>Taxa a.a</th>
                    <th>Prazo a.m</th>
                    <th>Valor no venc.</th>
                    <th>Rend. bruto</th>
                    <th>IR</th>
                    <th>Rend. líquido</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <template x-for="(sim, index) in simulacoes" :key="sim.id">
                    <tr>
                        <td x-text="index + 1"></td>
                        <td x-text="formatarMoeda(sim.montanteAplicado)"></td>
                        <td>
                            <div class="is-flex is-justify-content-space-between is-align-items-center">
                                <div>
                                    <span x-text="sim.info"></span>
                                    <span x-show="sim.inflacaoPeriodo > 0" class="tag is-warning is-light is-rounded ml-1">c/ Inflação</span>
                                </div>
                                <span class="tag is-info is-light is-rounded" x-text="formatarPercentual(sim.taxaReal)"></span>
                            </div>
                        </td>
                        <td x-text="sim.prazoMes"></td>
                        <td>
                            <span class="has-text-weight-semibold" x-text="formatarMoeda(sim.valorNoVencimento)"></span>
                        </td>
                        <td x-text="formatarMoeda(sim.bruto)"></td>
                        <td class="has-text-danger">
                            <div class="is-flex is-justify-content-space-around is-align-items-center">
                                <span x-text="formatarMoeda(sim.impostoDevido * -1)"></span>
                                <span class="tag is-light is-rounded" 
                                      :class="sim.aliquotaIR > 0 ? 'is-danger' : 'is-success'"
                                      x-text="sim.aliquotaIR > 0 ? formatarPercentual(sim.aliquotaIR * 100) : 'Isento'"></span>
                            </div>
                        </td>
                        <td class="has-text-weight-semibold" x-text="formatarMoeda(sim.liquido)"></td>
                        <td>
                            <a class="link py-4 has-text-grey-dark" @click="removerSimulacao(sim.id)">
                                <span class="icon"><i class="fas fa-trash"></i></span>
                            </a>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div class="buttons is-right">
            <button class="button is-small is-danger is-light is-rounded" @click="limparSimulacoes()">
                <span class="icon"><i class="fas fa-trash"></i></span>
                <span>Limpar todos</span>
            </button>
        </div>
    </div>
</div>

<script>
function simuladorRendaFixa() {
    return {
        indices: {},
        simulacoes: [],
        dadosEntrada: {
            montante: 0,
            prazo: 12,
            taxa: 15,
            tipoIndice: 'pre',
            IR: true,
            calcularInflacao: false
        },
        montanteFormatado: 'R$ 0,00',
        resultado: {
            montanteAplicado: 0,
            valorNoVencimento: 0,
            bruto: 0,
            liquido: 0,
            impostoDevido: 0,
            aliquotaIR: 0,
            prazoMes: 0,
            info: '',
            taxaReal: 0,
            inflacaoPeriodo: 0,
            divididoNoPrazo: 0
        },

        get labelTaxa() {
            const labels = {
                'pre': 'Taxa a.a',
                'pos': '% da CDI a.a',
                'poupanca': 'Poupança a.a',
                'ipca': '+ IPCA a.a',
                'selic': '+ SELIC a.a'
            };
            return labels[this.dadosEntrada.tipoIndice] || 'Taxa a.a';
        },

        async init() {
            await this.carregarIndices();
            this.calcular();
        },

        async carregarIndices() {
            try {
                const response = await fetch('https://objectstorage.sa-vinhedo-1.oraclecloud.com/n/axjwvnzorobg/b/indices/o/latest.json');
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    const selic = data.find(item => item.nome === 'SELIC');
                    const ipca = data.find(item => item.nome === 'IPCA');
                    const poupanca = data.find(item => item.nome === 'Poupança');
                    
                    if (selic) this.indices.SELIC = selic;
                    if (ipca) this.indices.IPCA = ipca;
                    if (poupanca) this.indices.Poupança = poupanca;
                }
            } catch (error) {
                console.error('Erro ao carregar índices:', error);
            }
        },

        alterarTipo() {
            if (this.dadosEntrada.tipoIndice === 'pre') {
                this.dadosEntrada.taxa = 15;
            } else if (this.dadosEntrada.tipoIndice === 'pos') {
                this.dadosEntrada.taxa = 90;
            } else if (this.dadosEntrada.tipoIndice === 'poupanca') {
                this.dadosEntrada.taxa = this.indices.Poupança?.valor || 0;
                this.dadosEntrada.IR = false;
            } else if (this.dadosEntrada.tipoIndice === 'ipca') {
                this.dadosEntrada.taxa = 5;
            } else if (this.dadosEntrada.tipoIndice === 'selic') {
                this.dadosEntrada.taxa = 0.5;
            }
            
            if (this.dadosEntrada.tipoIndice !== 'poupanca') {
                this.dadosEntrada.IR = true;
            }
            
            this.calcular();
        },

        calcular() {
            let taxa = this.dadosEntrada.taxa;
            let info = 'Pré-fixado';
            let inflacaoPeriodo = 0;

            if (this.dadosEntrada.tipoIndice === 'pos' && this.indices.SELIC?.valor) {
                taxa = (this.dadosEntrada.taxa * this.indices.SELIC.valor) / 100;
                info = `${this.dadosEntrada.taxa}% da CDI`;
            } else if (this.dadosEntrada.tipoIndice === 'ipca' && this.indices.IPCA?.valor) {
                taxa = this.dadosEntrada.taxa + this.indices.IPCA.valor;
                info = `${this.dadosEntrada.taxa}% + IPCA`;
            } else if (this.dadosEntrada.tipoIndice === 'selic' && this.indices.SELIC?.valor) {
                taxa = this.dadosEntrada.taxa + this.indices.SELIC.valor;
                info = `${this.dadosEntrada.taxa}% + SELIC`;
            } else if (this.dadosEntrada.tipoIndice === 'poupanca') {
                info = 'Poupança';
            }

            // Sempre usa taxa nominal para o cálculo do rendimento
            const taxaAnualDecimal = taxa / 100;
            const taxaMensal = Math.pow(1 + taxaAnualDecimal, 1/12) - 1;
            const valorNoVencimento = this.dadosEntrada.montante * Math.pow(1 + taxaMensal, this.dadosEntrada.prazo);
            
            let taxaReal = taxa;
            
            let inflacaoPercentual = 0;
            
            // Calcula inflação no período se solicitado
            if (this.dadosEntrada.calcularInflacao && this.indices.IPCA?.valor) {
                const taxaInflacaoAnual = this.indices.IPCA.valor / 100;
                const taxaInflacaoMensal = Math.pow(1 + taxaInflacaoAnual, 1/12) - 1;
                const valorCorroido = this.dadosEntrada.montante * Math.pow(1 + taxaInflacaoMensal, this.dadosEntrada.prazo);
                inflacaoPeriodo = valorCorroido - this.dadosEntrada.montante;
                inflacaoPercentual = (Math.pow(1 + taxaInflacaoMensal, this.dadosEntrada.prazo) - 1) * 100;
                
                // Taxa real descontando inflação (apenas para exibição)
                taxaReal = ((1 + taxa/100) / (1 + taxaInflacaoAnual) - 1) * 100;
            }
            const rendimentoBruto = valorNoVencimento - this.dadosEntrada.montante;
            
            let aliquotaIR = 0;
            // Se não é isento de IR (pergunta "Isento IR?" - "Não" = IR true = cobra imposto)
            if (this.dadosEntrada.IR === true && this.dadosEntrada.tipoIndice !== 'poupanca') {
                if (this.dadosEntrada.prazo <= 6) aliquotaIR = 0.225;
                else if (this.dadosEntrada.prazo <= 12) aliquotaIR = 0.2;
                else if (this.dadosEntrada.prazo <= 24) aliquotaIR = 0.175;
                else aliquotaIR = 0.15;
            }
            
            const impostoDevido = rendimentoBruto * aliquotaIR;
            let rendimentoLiquido = rendimentoBruto - impostoDevido;
            
            // Ajusta rendimento líquido pelo poder de compra se inflação ativada
            if (this.dadosEntrada.calcularInflacao && inflacaoPeriodo > 0) {
                rendimentoLiquido = rendimentoLiquido - inflacaoPeriodo;
            }
            
            const dividido = rendimentoLiquido > 0 && this.dadosEntrada.prazo > 0 ? rendimentoLiquido / this.dadosEntrada.prazo : 0;

            this.resultado = {
                montanteAplicado: this.dadosEntrada.montante,
                valorNoVencimento: parseFloat(valorNoVencimento.toFixed(2)),
                bruto: parseFloat(rendimentoBruto.toFixed(2)),
                liquido: parseFloat(rendimentoLiquido.toFixed(2)),
                impostoDevido: parseFloat(impostoDevido.toFixed(2)),
                aliquotaIR: aliquotaIR,
                prazoMes: this.dadosEntrada.prazo,
                info: info,
                taxaReal: taxaReal,
                inflacaoPeriodo: inflacaoPeriodo,
                inflacaoPercentual: inflacaoPercentual,
                divididoNoPrazo: dividido
            };
        },

        salvarSimulacao() {
            if (this.resultado.montanteAplicado <= 0) return;

            const existe = this.simulacoes.some(sim => 
                sim.montanteAplicado === this.resultado.montanteAplicado &&
                sim.prazoMes === this.resultado.prazoMes &&
                sim.taxaReal === this.resultado.taxaReal &&
                sim.info === this.resultado.info &&
                sim.aliquotaIR === this.resultado.aliquotaIR &&
                sim.inflacaoPeriodo === this.resultado.inflacaoPeriodo
            );
            
            if (!existe) {
                this.simulacoes.push({...this.resultado, id: Date.now()});
            }
        },

        removerSimulacao(id) {
            this.simulacoes = this.simulacoes.filter(sim => sim.id !== id);
        },

        limparSimulacoes() {
            this.simulacoes = [];
        },

        formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor);
        },

        formatarPercentual(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'percent',
                minimumFractionDigits: 1,
                maximumFractionDigits: 2
            }).format(valor / 100);
        },

        atualizarMontante(valor) {
            const numeros = valor.replace(/\D/g, '');
            const valorNumerico = parseFloat(numeros) / 100;
            this.dadosEntrada.montante = valorNumerico || 0;
            this.montanteFormatado = this.formatarMoeda(valorNumerico || 0);
            this.calcular();
        }
    }
}
</script>
